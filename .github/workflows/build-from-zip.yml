name: Build APK from zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Unzip project and build debug APK
        run: |
          set -euo pipefail
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip found in the repo root. Upload the project zip, then re-run this workflow."
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf project && mkdir project
          unzip -q "$ZIP" -d project
          SETTINGS=$(find project -maxdepth 3 -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found inside $ZIP"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: genz-keyboard-debug-apk
          path: out/*.apk
          if-no-files-found: error
